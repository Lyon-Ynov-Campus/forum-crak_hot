<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Inscription - Crak'Hot</title>
</head>
<body class="auth-body">
    <main class="auth-page">
        <div class="brand-logo">
            <img src="/assets/logo.png" alt="Crak'Hot">
        </div>

        <div class="auth-container">
            <div class="auth-tabs">
                <a href="/login" class="tab inactive">Se connecter</a>
                <div class="tab active">S'inscrire</div>
            </div>
            
            <form action="/register" method="POST" class="auth-form">
                <div class="form-group">
                    <label>Pseudo :</label>
                    <input type="text" name="username" placeholder="Votre pseudo" required>
                </div>
                <div class="form-group">
                    <label>Email :</label>
                    <input type="email" name="email" placeholder="votre@email.com" required>
                </div>
                <div class="form-group">
                    <label>Password :</label>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password :</label>
                    <input type="password" name="confirm_password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-black">S'inscrire</button>
            </form>
        </div>
    </main>
</body>
</html>
