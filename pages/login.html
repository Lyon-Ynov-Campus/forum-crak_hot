<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Connexion</title>
</head>
<body class="auth-body">
    <main class="auth-page">
        <div class="brand-logo">
            <img src="/assets/logo.png" alt="Crak'Hot">
        </div>
        
        <div class="auth-container">
            <div class="auth-tabs">
                <div class="tab active">Se connecter</div>
                <a href="/register" class="tab inactive">S'inscrire</a>
            </div>

        <!-- <section class="card stack auth-card">
            <div class="pill">Titre</div>
            <h1>Connexion</h1>
            <p class="muted">Connecte-toi ou crée ton compte.</p> -->

            {{if .ResetSent}}
                <div class="alert success" style="color: #2ecc71; margin-bottom: 15px; font-weight: 600; padding: 15px; background-color: #f0f8f4; border-radius: 8px;">
                    Si cet email existe, vous devriez recevoir un lien de réinitialisation. Ce lien expire dans 1 heure.
                </div>
            {{end}}

            <form action="/checklogin" method="post" class="auth-form">
                <div class="form-group">
                    <label for="email_Username">E-mail ou nom d'utilisateur :</label>
                    <input type="text" id="email_Username" name="email_Username" 
                        placeholder="Votre identifiant"
                        value="{{.Email_Username}}" required>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe :</label>
                    <input type="password" id="password" name="password" placeholder="Votre mot de passe" required>
                    <a href="/forgot-password" class="forgot-link" style="font-size: 0.8rem; display: block; margin-top: 5px;">Mot de passe oublié ?</a>
                </div>

                <button type="submit" class="btn-black">Connexion</button>
            </form>
        <!-- </section> -->
    </main>

    {{template "footer" .}}
