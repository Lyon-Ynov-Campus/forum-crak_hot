{{template "header" .}}

<main class="container">
    <div style="margin-bottom: 30px; border-left: 5px solid #ff4500; padding-left: 15px;">
        <h1 style="color: #fff; margin: 0; font-size: 2rem;">Espace Réseau</h1>
        <p style="color: #888; margin: 5px 0 0 0;">Connectez-vous avec les autres passionnés de piment.</p>
    </div>

    <div style="padding: 40px 20px; background: #1a1a1a; border-radius: 12px; border: 1px solid #333; text-align: center;">
        <h2 style="color: #fff; margin-bottom: 20px; font-size: 1.5rem;">Trouver des membres 🌶️</h2>
        
        <div style="max-width: 500px; margin: 0 auto; display: flex; gap: 10px;">
            <input type="text" id="userInputSearch" placeholder="Entrez un pseudo..." 
                style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #111; color: #fff; outline: none;">
            <button onclick="performNetworkSearch()" class="btn-post" style="padding: 0 25px; cursor: pointer;">Chercher</button>
        </div>
    </div>

    <div id="usersResultsGrid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 40px;">
    </div>

    <div style="margin-top: 40px; text-align: center;">
        <a href="/forum" class="btn-login-text" style="color: #666; text-decoration: none;">&larr; Retourner aux discussions</a>
    </div>
</main>

<script>
// Soumission automatique si l'utilisateur appuie sur "Entrée"
document.getElementById('userInputSearch').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        performNetworkSearch();
    }
});

function performNetworkSearch() {
    const inputField = document.getElementById('userInputSearch');
    const searchTerm = inputField.value.trim();
    const resultsGrid = document.getElementById('usersResultsGrid');
    
    if (searchTerm === "") return;

    resultsGrid.innerHTML = '<p style="color: #888; text-align: center; grid-column: 1 / -1;">Recherche de profils croustillants...</p>';

    // Consommation asynchrone de la route d'API 
    fetch(`/api/search-users?username=${encodeURIComponent(searchTerm)}`)
    .then(response => response.json())
    .then(users => {
        resultsGrid.innerHTML = ''; 

        if (!users || users.length === 0) {
            resultsGrid.innerHTML = '<p style="color: #666; text-align: center; grid-column: 1 / -1;">Aucun membre ne porte ce nom à l\'horizon...</p>';
            return;
        }

        users.forEach(user => {
            console.log("Objet utilisateur reçu de l'API Go :", user);

            let displayName = "Membre";
            let userId = null;
            let profilePic = '/static/pp/defaultPP.png';

            Object.keys(user).forEach(key => {
                const lowerKey = key.toLowerCase();
                
                if (lowerKey.includes("username") || lowerKey.includes("pseudo") || lowerKey === "name" || lowerKey === "nom") {
                    if (user[key]) displayName = user[key];
                }
                
                if (lowerKey === "id" || lowerKey === "userid") {
                    userId = user[key];
                }

                if (lowerKey.includes("photo") || lowerKey.includes("avatar") || lowerKey.includes("pp")) {
                    if (user[key]) profilePic = user[key];
                }
            });

            if (userId === null || userId === undefined || userId === 0) {
                // On teste manuellement les structures Go les plus fréquentes :
                userId = user.ID || user.id || user.Id || user.UserID || 0;
                
                if (userId === 0) {
                    for (let key in user) {
                        if (typeof user[key] === 'number' && user[key] > 0) {
                            userId = user[key];
                            break;
                        }
                    }
                }
            }

            resultsGrid.innerHTML += `
                <div class="user-network-card" style="background: #111; border: 1px solid #222; border-radius: 8px; padding: 25px 15px; text-align: center;">
                    <img src="${profilePic}" style="width: 75px; height: 75px; object-fit: cover; border-radius: 50%; border: 2px solid #ff4500; margin-bottom: 15px; display: inline-block;">
                    <h3 style="color: #fff; margin: 0 0 15px 0; font-size: 1.1rem;">${displayName}</h3>
                    <a href="/seeUser?id=${userId}" class="btn-post" style="display: inline-block; padding: 8px 16px; font-size: 13px; font-weight: bold; text-decoration: none; border-radius: 4px;">
                        Voir le profil
                    </a>
                </div>
            `;
        });
    })
    .catch(error => {
        console.error("Erreur API Réseau:", error);
        resultsGrid.innerHTML = '<p style="color: #ff4500; text-align: center; grid-column: 1 / -1;">Une erreur est survenue lors de la recherche.</p>';
    });
}
</script>

{{template "footer" .}}
