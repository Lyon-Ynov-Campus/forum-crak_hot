{{ template "header" . }}

<main class="container">

    <h1 class="category-title">Tous les posts</h1>

    <div class="filter-tabs">
        <a class="filter-link active-filter">TOP</a>
        <a class="filter-link">RECENTS</a>
    </div>

    <div class="action-bar">
        <a href="/postCreate" class="btn-post">+ Poster</a>
    </div>

    <div class="forum-table-wrapper">
        <table class="forum-table">
            <thead>
                <tr>
                    <th>SUJET</th>
                    <th>AUTEUR</th>
                    <th>CATÉGORIE</th>
                    <th>COMMENTAIRES</th>
                    <th>DATE</th>
                    <th>LIKES</th>
                </tr>
            </thead>
            <tbody>
                {{range .Posts}}
                <tr>
                    <td>
                        <a href="/post?id={{.ID}}" class="subject-title">{{.Titre}}</a>
                    </td>
                    <td class="text-muted">{{.Author}}</td>
                    <td class="text-muted">{{.Categorie}}</td>
                    <td class="text-muted">{{.ComCount}}</td>
                    <td class="text-muted">{{.Date}}</td>
                    <td class="text-muted">{{.LikeCount}}</td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>

</main>

{{ template "footer" . }}
