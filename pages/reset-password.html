<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Crak'Hot - Nouveau mot de passe</title>
</head>
<body class="auth-body">
    <main class="auth-page">
        <div class="brand-logo">
            <a href="/">
                <img src="/assets/logo.png" alt="Crak'Hot">
            </a>
        </div>

        <div class="auth-container">
            <div class="auth-tabs">
                <div class="tab active" style="width: 100%;">RÉINITIALISATION</div>
            </div>

            <div class="auth-content">
                {{if .ResetSuccess}}
                    <div class="alert success-box" style="margin-bottom: 20px; text-align: center;">
                        <p>{{.ResetSuccess}}</p>
                    </div>
                    <div style="text-align: center; margin-top: 20px;">
                        <a href="/login" class="btn-black">Retour à la connexion</a>
                    </div>
                {{else}}
                    {{if .ResetError}}
                        <div class="alert error-text" style="color: #ff4d4d; margin-bottom: 15px; font-weight: 600; font-size: 0.85rem;">
                            {{.ResetError}}
                        </div>
                    {{end}}

                    <form action="/reset-password" class="auth-forms" method="POST">
                        <input type="hidden" name="token" value="{{.Token}}">

                        <div class="form-group">
                            <label for="password">Nouveau mot de passe :</label>
                            <input type="password" id="password" name="password" placeholder="••••••••" required>
                            
                            <div style="background: #111; padding: 12px; border-radius: 8px; margin-top: 10px; border: 1px solid #222;">
                                <ul style="font-size: 0.8rem; color: #888; list-style: none; padding: 0; margin: 0; line-height: 1.5;">
                                    <li>• 12 caractères minimum</li>
                                    <li>• Une majuscule & une minuscule</li>
                                    <li>• Un chiffre & un caractère spécial</li>
                                </ul>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="confirm_password">Confirmer le mot de passe :</label>
                            <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
                        </div>

                        <button type="submit" class="btn-black" style="margin-top: 10px;">Enregistrer le mot de passe 🌶️</button>
                    </form>
                    
                    <div style="margin-top: 25px; text-align: center;">
                        <a href="/login" style="text-decoration: none; color: #666; font-size: 0.8rem;">&larr; Annuler et retourner à la connexion</a>
                    </div>
                {{end}}
            </div>
        </div>
    </main>
</body>
</html>
