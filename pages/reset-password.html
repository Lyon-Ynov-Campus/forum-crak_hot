<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Réinitialiser le mot de passe</title>
</head>
<body class="auth-body">
    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-tabs">
                <div class="tab active" style="width: 100%;">RÉINITIALISER MOT DE PASSE</div>
            </div>

            <form action="/reset-password" class="auth-form" method="POST">
                <input type="hidden" name="token" value="{{.Token}}">

                <div class="form-group">
                    <label for="password">Nouveau mot de passe :</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                    <p style="font-size: 0.85rem; color: #7f8c8d; margin-top: 8px;">
                        • Au moins 12 caractères<br>
                        • Une majuscule<br>
                        • Une minuscule<br>
                        • Un chiffre<br>
                        • Un caractère spécial
                    </p>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirmer le mot de passe :</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-black">Réinitialiser le mot de passe</button>

                <div style="margin-top: 20px; text-align: center;">
                    <a href="/login" class="btn-login-text" style="font-size: 11px;">Retour à la page de connexion</a>
                </div>
            </form>
        </div>
    </main>

    {{template "footer" .}}
