<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Inscription</title>
</head>
<body class="auth-body">
    <main class="auth-page">
        <div class="brand-logo">
            <img src="/assets/logo.png" alt="Crak'Hot">
        </div>

        <div class="auth-container">
            <div class="auth-tabs">
                <a href="/login" class="tab inactive">Se connecter</a>
                <div class="tab active">S'inscrire</div>
            </div>
        </div>
        <!-- <section class="card stack auth-card">
            <div class="pill"></div>
            <h1>Inscription</h1>
            <p class="muted">Crée ton compte et rejoins tes amis.</p> -->

            <form action="/checkregister" method="post" class="auth-form">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur :</label>
                    <input type="text" id="username" name="username"  placeholder="Votre pseudo"
                        value="{{if .AccountError}}{{.Username}}{{end}}" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail :</label>
                    <input type="email" id="email" name="email" placeholder="votre@email.com"
                    value="{{if .AccountError}}{{.Email}}{{end}}" required>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe :</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label for="confpassword">Confirmer le mot de passe :</label>
                    <input type="password" id="confpassword" name="confpassword" placeholder="••••••••" required>
                </div>

                <div class="password-info">
                    <div class="tooltip-container">
                        <span class="info-icon">!</span>
                        <span class="tooltip-text">
                            <strong>Critères du mot de passe :</strong><br>
                            • 12 caractères minimum<br>
                            • Majuscule & Minuscule<br>
                            • Chiffre & Caractère spécial<br>
                            • Sans accent ni espace
                        </span>
                    </div>
                    <span class="info-label">Exigences de sécurité</span>
                </div>

                    {{if .AccountError}}
                        <div class="alert" style="color: #ff4d4d; margin-bottom: 15px; font-weight: 600;">
                            {{.AccountError}}
                        </div>
                    {{end}}

                <button type="submit" class="btn-black">S'inscrire</button>
            </form>
        </section>
    </main>
</body>
</html>
