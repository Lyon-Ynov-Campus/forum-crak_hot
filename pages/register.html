<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Inscription</title>
</head>
<body class="auth-body">
    <main class="auth-page">
        <div class="brand-logo">
            <img src="/assets/logo.png" alt="Crak'Hot">
        </div>

        <div class="auth-container"> <div class="auth-tabs">
                <a href="/login" class="tab inactive">Se connecter</a>
                <div class="tab active">S'inscrire</div>
            </div>
            
            <form action="/checkregister" method="POST" class="auth-form">
                <div class="form-group">
                    <label>Pseudo :</label>
                    <input type="text" name="username" placeholder="Votre pseudo" value="{{if .AccountError}}{{.Username}}{{end}}" required>
                </div>
                <div class="form-group">
                    <label>Email :</label>
                    <input type="email" name="email" placeholder="votre@email.com" value="{{if .AccountError}}{{.Email}}{{end}}" required>
                </div>
                <div class="form-group">
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
                        <label style="margin-bottom: 0;">Mot de passe :</label>
                        
                        <div class="password-info" style="margin: 0; display: flex; align-items: center;">
                            <div class="tooltip-container" style="display: flex; align-items: center;">
                                <span class="info-icon" style="width: 16px; height: 16px; line-height: 16px; font-size: 12px;">!</span>
                                <span class="tooltip-text">
                                    <strong>Critères du mot de passe :</strong><br>
                                    • 12 caractères minimum<br>
                                    • Majuscule & Minuscule<br>
                                    • Chiffre & Caractère spécial<br>
                                    • Sans accent ni espace
                                </span>
                            </div>
                            <span class="info-label" style="font-size: 11px; margin-left: 5px; color: #999;">Exigences de sécurité</span>
                        </div>
                    </div>
                    
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label>Confirmer :</label>
                    <input type="password" name="confpassword" placeholder="••••••••" required>
                </div>

                {{if .AccountError}}
                    <div class="alert" style="color: #ff4d4d; margin-top: 10px; font-weight: 600;">
                        {{.AccountError}}
                    </div>
                {{end}}

                <button type="submit" class="btn-black">S'inscrire</button>
            </form>
        </div>
    </main>
</body>
</html>
