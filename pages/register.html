<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/styles.css">
    <title>Inscription</title>
</head>
<body>
    <main class="auth-shell">
        <section class="card stack auth-card">
            <div class="pill"></div>
            <h1>Inscription</h1>
            <p class="muted">Crée ton compte et rejoins tes amis.</p>

            <form action="/checkregister" method="post" class="stack">


                <label for="username">Nom d'utilisateur :</label>
                <input type="text" id="username" name="username" required value="{{if .AccountError}}{{.Username}}{{end}}">

                <label for="email">E-mail :</label>
                <input type="email" id="email" name="email" required value="{{if .AccountError}}{{.Email}}{{end}}">

                <label for="password">Mot de passe :</label>
                <input type="password" id="password" name="password" required>

                <label for="confpassword">Confirmer le mot de passe :</label>
                <input type="password" id="confpassword" name="confpassword" required>

                <p class="muted">Critère minimum du mot de passe : majuscule, minuscule, chiffre, caractère spécial, sans accent ni espace (12+ caractères).</p>

                {{if .AccountError}}
                    <div class="alert">{{.AccountError}}</div>
                {{end}}

                <input type="submit" value="S'inscrire">
            </form>

            <form action="/login" method="post" class="btn-row">
                <button type="submit" class="btn secondary">J'ai déjà un compte</button>
            </form>
        </section>
    </main>
</body>
</html>
