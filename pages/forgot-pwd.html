{{template "header.html" .}}

<main class="auth-body">
    <div class="auth-container">
        <div class="auth-tabs">
            <div class="tab active" style="width: 100%;">REINITIALISATION</div>
        </div>
        <form action="/send-reset" class="auth-forms" method="POST">
            <div class="form-group">
                <label>Email associé au compte :</label>
                <input type="email" name="email" placeholder="piment@hot.com" required>
            </div>
            <button type="submit">Recevoir le Lien</button>
            <div class="margin-top: 20px; text-align: center;">
                <a href="/login" class="btn-login-text" style="font-size: 11px;">Retour à la page de connexion</a>
            </div>
        </form>
    </div>
</main>

{{template "footer.html" .}}
