<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Connexion - Crak'Hot</title>
</head>
<body class="auth-body">
    <main class="auth-page">
        <div class="brand-logo">
            <img src="/assets/logo.png" alt="Crak'Hot">
        </div>
        
        <div class="auth-container">
            <div class="auth-tabs">
                <div class="tab active">Se connecter</div>
                <a href="/register" class="tab inactive">S'inscrire</a>
            </div>
            
            <form action="/login" method="POST" class="auth-form">
                <div class="form-group">
                    <label>Email/Pseudo :</label>
                    <input type="text" name="identifier" placeholder="Votre identifiant" required>
                </div>
                <div class="form-group">
                    <label>Password :</label>
                    <input type="password" name="password" placeholder="••••••••" required>
                    <a href="/forgot-pwd" class="forgot-link">Mot de passe oublié ?</a>
                </div>
                <button type="submit" class="btn-black">Connexion</button>
            </form>
        </div>
    </main>
</body>
</html>
